# The service bot on the shared Oracle Cloud VM. HTTPS is the VM's own Caddy
# (infra/oracle-vm/), which proxies 140-238-251-141.sslip.io to the port
# published below. Secrets live in .env beside this file — on the server
# only, never committed (svc-agent/.gitignore covers it).
#
#   docker compose up -d --build       start, or rebuild after a git pull
#   docker compose logs -f app         the boot log and every request error
name: svc-agent

services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    env_file: .env
    # The same values fly.toml sets. These win over anything in .env.
    environment:
      PORT: "8080"
      DB_PATH: /data/service.db
      DEMO_MODE: "true"
      BEHIND_PROXY: "true"
    # Localhost only: Caddy is the one way in from outside. 8080 is this
    # site's entry in the port register (infra/oracle-vm/README.md).
    ports:
      - "127.0.0.1:8080:8080"
    # The database. A named volume outlives the container, so a rebuild keeps
    # every booking.
    volumes:
      - svc_data:/data

volumes:
  svc_data:
